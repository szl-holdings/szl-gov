    host: inference.a-11-oy.com
    path_prefixes:
      - /v1/completions
      - /v1/responses
    methods:
      - GET
    methods_basis: cloudflare-default
    audience: everyone
    scheme: exact
    amount_atomic: 20000
    exemption: estate-probe-user-agents
    expression: "(http.host eq \"inference.a-11-oy.com\" and (starts_with(http.request.uri.path, \"/v1/completions\") or starts_with(http.request.uri.path, \"/v1/responses\")) and http.request.method ne \"OPTIONS\" and not (http.user_agent contains \"szl-redacted:estate-probe-user-agents:n=6:sha256=85403a2e84f12b652090d8179a750184546c0fb49ba1f30b249fa512fb988e5a\"))"
  - id: a11oy-mesh-frontier
    surface: a11oy mesh and frontier APIs
    rule_id: "94dc6d8169a84173bf0005bea66e50eb"
    rule_description: Premium API mesh/frontier (bots)
    zone: a-11-oy.com
    host: "*"
    path_prefixes:
      - /api/a11oy/v1/mesh/
      - /api/a11oy/v1/frontier/
    methods:
      - GET
    methods_basis: cloudflare-default
    audience: verified_bots
    scheme: exact
    amount_atomic: 50000
    exemption: estate-probe-user-agents
    expression: "((starts_with(http.request.uri.path, \"/api/a11oy/v1/mesh/\") or starts_with(http.request.uri.path, \"/api/a11oy/v1/frontier/\")) and cf.client.bot and not (http.user_agent contains \"szl-redacted:estate-probe-user-agents:n=6:sha256=85403a2e84f12b652090d8179a750184546c0fb49ba1f30b249fa512fb988e5a\"))"
  - id: a11oy-attest-ledger
    surface: a11oy attest and ledger APIs
    rule_id: b8026fdb4f0d42c6ba734ddd77e75644
    rule_description: Premium attest/ledger APIs (bots)
    zone: a-11-oy.com
    host: "*"
    path_prefixes:
      - /api/a11oy/v1/attest/
      - /api/a11oy/v1/ledger
    methods:
      - GET
    methods_basis: cloudflare-default
    audience: verified_bots
    scheme: exact
    amount_atomic: 25000
    exemption: estate-probe-user-agents
    expression: "((starts_with(http.request.uri.path, \"/api/a11oy/v1/attest/\") or starts_with(http.request.uri.path, \"/api/a11oy/v1/ledger\")) and cf.client.bot and not (http.user_agent contains \"szl-redacted:estate-probe-user-agents:n=6:sha256=85403a2e84f12b652090d8179a750184546c0fb49ba1f30b249fa512fb988e5a\"))"
