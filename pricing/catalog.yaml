# SZL estate: canonical per-call (x402) price catalog.
#
# This is the only hand-edited list of per-call prices. The x402 manifest
# (a-11-oy.com/.well-known/x402-pricing.json), the per-call table on
# a-11-oy.com/pricing and README price snippets are generated from it:
#   python tools/pricing_catalog.py generate
# It must agree with an exported snapshot of the Cloudflare Monetization
# Gateway rules; tests/test_pricing_catalog.py runs this against the committed
# snapshot, and the same check runs against a fresh export:
#   python tools/pricing_catalog.py check --rules <export.json> [--changes <log.json>]
# Prices are atomic USDC units: 1000000 = $1.00, 10000 = $0.01.
# Formatting is canonical yamlite: python tools/pricing_catalog.py fmt

schema: szl.pricing-catalog/v1
as_of: "2026-11-13T22:49:00Z"
sources:
  rules_export: pricing/snapshots/monetization-rules-2026-11-13.redacted.json
  rules_export_note: "Fresh Cloudflare Monetization Gateway readback on 2026-11-13. The a-11-oy.com export has 16 rules, including the disabled evidence-snapshot rule, and the enabled completions/responses rule explicitly excludes OPTIONS for browser preflight."
  change_log: pricing/snapshots/monetization-changes-2026-11-06.json
  change_log_note: "Three rules disabled between 2026-11-06T16:27:21Z and 16:27:25Z; each PATCH returned 200 and its before_enabled matched the export."
  rules_checked_against: "the fresh 2026-11-13 Cloudflare API readback, including the current payout wallet, the OPTIONS exclusion and the disabled evidence-snapshot rule"
  catalog_url: "https://github.com/szl-holdings/szl-gov/blob/main/pricing/catalog.yaml"
  authority: The HTTP 402 PAYMENT-REQUIRED response from the gateway is authoritative. This file lists what the exported gateway rules charged at as_of; a rule edited in the Cloudflare dashboard after as_of is not reflected until the catalog is updated and regenerated.
  methods_basis:
    cloudflare-default: "The rules export records no HTTP method selection. Cloudflare documents that a rule charges GET requests by default (Monetization Gateway docs, Monetization rules, updated 2026-09-30), so GET is listed; whether POST requests are charged is unverified."
  payment_evidence: "network, asset, asset_name and max_timeout_seconds come from fresh x402 v2 PAYMENT-REQUIRED headers observed on 2026-11-11; the 2026-11-13 Cloudflare API readback records the current pay_to on all 16 a-11-oy.com rules. Live 402 challenges confirm payTo 0x7b13."
  wallet_change: "On 2026-11-12 at 11:27 AM ET (16:27 UTC), owner Stephen Lutar confirmed ownership of receiving wallet 0x7b133ef996852c223379d6d1245430300970291A (Base, eip155:8453, USDC). The current Cloudflare readback records that address on all 16 a-11-oy.com rules and both disabled a11oy.net rules. Historical snapshots were not modified."
policy:
  decided_by: owner
  decided_on: "2026-11-06"
  statement: "Charge API and MCP hosts only. Websites, /pricing, the proof site a11oy.net, health checks and /.well-known paths stay free."
  applied_by: the change log (the catch-all rules on a-11-oy.com and a11oy.net were disabled)
payment:
  protocol: x402
  x402_version: 2
  network: "eip155:8453"
  asset: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
  asset_name: USD Coin
  atomic_per_usd: 1000000
  pay_to: "0x7b133ef996852c223379d6d1245430300970291A"
  max_timeout_seconds: 3600
contact: "hello@a-11-oy.com"
contact_source: the sales address on a-11-oy.com/pricing (szl-holdings/a11oy pages/pricing.html)
exemptions:
  estate-probe-user-agents:
    count: 6
    sha256: "85403a2e84f12b652090d8179a750184546c0fb49ba1f30b249fa512fb988e5a"
    note: "Every rule skips requests whose User-Agent contains one of the estate's own probe names. The names are withheld because a user-agent match can be spoofed; the count and digest let the check detect any change to the list."
zones:
  - zone: a-11-oy.com
    rules_defined: 16
    rules_enabled: 4
    probe_hosts:
      - a-11-oy.com
      - api.a-11-oy.com
      - inference.a-11-oy.com
      - mcp.a-11-oy.com
  - zone: a11oy.net
    rules_defined: 2
    rules_enabled: 0
    probe_hosts:
      - a11oy.net
  - zone: szlholdings.com
    rules_defined: 0
    rules_enabled: 0
    probe_hosts:
      - szlholdings.com
charged:
  - id: chat
    surface: OpenAI-compatible chat
    rule_id: "41cee0f88822411baf864bb54e8b4727"
    rule_description: "Doctrine chat - Nemotron Estate flagship (everyone, x402)"
    zone: a-11-oy.com
    host: "*"
    path_prefixes:
