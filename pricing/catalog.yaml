    methods:
      - GET
    methods_basis: cloudflare-default
    audience: everyone
    scheme: exact
    amount_atomic: 20000
    exemption: estate-probe-user-agents
    expression: "(starts_with(http.request.uri.path, \"/v1/chat/\") and not (http.user_agent contains \"szl-redacted:estate-probe-user-agents:n=6:sha256=85403a2e84f12b652090d8179a750184546c0fb49ba1f30b249fa512fb988e5a\"))"
