name: Repository truth checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      enforce_readiness:
        description: Fail unless both Space and commercial release readiness gates pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Prove exact event source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Contract tests (receipt stack)
        run: python3 tools/test_receipt.py

  lexicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Prove exact event source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Ledger build (brings ledgers to latest)
        run: python3 tools/build_ledgers.py
      - name: Lexicon gate — no claim without evidence
        run: python3 tools/lexicon_gate.py

  spaces-readiness-audit:
    name: Spaces readiness audit (non-promotional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Prove exact event source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python3 tools/tier_spaces.py
      - name: Record Space readiness without claiming promotion
        shell: bash
        run: |
          set +e
          python3 tools/spaces_gate.py
          code=$?
          set -e
          case "$code" in
            0)
              echo "Space readiness audit result: READY" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            2|3|4)
              {
                echo "Space readiness audit result: BLOCKED (exit $code)"
                echo
                echo "This green job means the non-promotional audit executed; it is not deployment or release evidence."
              } | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Space readiness audit crashed with unexpected exit code $code"
              exit "$code"
              ;;
          esac

  commercial-readiness-audit:
    name: Commercial readiness audit (non-promotional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Prove exact event source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python3 tools/build_ledgers.py
      - name: Record commercial readiness without claiming release
        shell: bash
        run: |
          set +e
          python3 tools/release_gate.py
          code=$?
          set -e
          case "$code" in
            0)
              echo "Commercial readiness audit result: READY" | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            6)
              {
                echo "Commercial readiness audit result: BLOCKED (exit 6)"
                echo
                echo "This green job means the non-promotional audit executed; it is not a release claim."
              } | tee -a "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Commercial readiness audit crashed with unexpected exit code $code"
              exit "$code"
              ;;
          esac

  enforce-readiness:
    name: Enforce Space and commercial readiness
    if: github.event_name == 'workflow_dispatch' && inputs.enforce_readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Prove exact event source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python3 tools/build_ledgers.py
      - run: python3 tools/tier_spaces.py
      - name: Enforce Space readiness
        run: python3 tools/spaces_gate.py
      - name: Enforce commercial release readiness
        run: python3 tools/release_gate.py
