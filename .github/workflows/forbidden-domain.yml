# Release-blocking CRITICAL gate for the szl-holdings estate.
#
# Rule (validated on the live org): a line matching
#     (?<!-)a11oy\.com
# is a violation UNLESS the same line is a prohibition/guard context, i.e. it
# also matches /(never|forbidden|not in|assertNotIn|does not appear|is not a
# surface|blocklist)/i — guard assertions, blocklists, and doctrine notes are
# legitimate. Canonical surfaces are a-11-oy.com (product) and a11oy.net
# (proof).
#
# Installed by the szl-alignment engine; keep in sync with
# alignment/templates/workflows/forbidden-domain.yml. This copy replaces the
# template's ripgrep call (absent on the runner, so the scan never ran) with
# GNU grep and fails on scanner errors; the template needs the same fix.
name: forbidden-domain

on:
  pull_request:

permissions:
  contents: read

env:
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false

      - name: Prove exact event source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"

      # GNU grep ships on every GitHub-hosted Ubuntu runner; ripgrep does not.
      # The earlier rg-based scan logged "rg: command not found" and its
      # `|| true` turned that into a clean result on every run. grep exits
      # 0 (matches), 1 (no matches) or >1 (error): only 0 and 1 are results,
      # anything else stops the gate.
      - name: Scan for forbidden domain references
        shell: bash
        run: |
          set -euo pipefail
          status=0
          hits="$(grep -rnIP --exclude-dir=.git '(?<!-)a11oy\.com' .)" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::Forbidden-domain scan could not run (grep exit $status); refusing to report clean."
            exit "$status"
          fi
          status=0
          violations="$(printf '%s' "$hits" | grep -viE 'never|forbidden|not in|assertNotIn|does not appear|is not a surface|blocklist')" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::Forbidden-domain guard filter could not run (grep exit $status); refusing to report clean."
            exit "$status"
          fi
          if [ -n "$violations" ]; then
            echo "::error::Forbidden domain references found (release-blocking CRITICAL)."
            echo "::error::Replace with a-11-oy.com or remove; guard contexts must say so on the same line."
            printf '%s\n' "$violations"
            exit 1
          fi
          echo "OK: no forbidden domain references outside guard contexts."
